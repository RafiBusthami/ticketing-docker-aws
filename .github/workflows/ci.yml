name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -v
      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t ticket-api:ci app/
      - name: Run container and check /health
        run: |
          docker run -d --name ticket-api -p 8080:8080 ticket-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs ticket-api; exit 1
