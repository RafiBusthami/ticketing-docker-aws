# Local / EC2 run of the two planned services.
#   docker compose up -d                      -> ticket-api only (Week 12)
#   docker compose --profile planned up -d    -> + ticket-web (planned, Week 13+)
services:
  ticket-api:
    build:
      context: ./app
      args:
        APP_VERSION: local
    image: ticket-api:local
    ports:
      - "8080:8080"
    volumes:
      - ticket-data:/data
    restart: unless-stopped
    networks: [ticketing-net]

  # Service 2 (planned): web front end + reverse proxy, official nginx image
  ticket-web:
    profiles: ["planned"]
    image: public.ecr.aws/nginx/nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
    depends_on: [ticket-api]
    networks: [ticketing-net]

volumes:
  ticket-data:

networks:
  ticketing-net:
